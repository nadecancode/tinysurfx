name: Build api-only binaries

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required for tag-triggered Release publish

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            apt: musl-tools
          - asset: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
            apt: musl-tools
          - asset: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            apt: ""
          - asset: macos-x86_64
            # Cross-compile from the M-series macos-latest runner. The macos-13
            # Intel runner has very scarce capacity (jobs queued 15+ min). Apple's
            # toolchain ships SDK + linker for both arches, so this just works.
            runner: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            apt: ""
          - asset: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            apt: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install musl-tools
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --bin tinysurfx --no-default-features --features api-only --profile bsr2 --target ${{ matrix.target }}

      - name: Strip (unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/bsr2/tinysurfx${{ matrix.ext }} || true

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          NAME="tinysurfx-${{ matrix.asset }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/bsr2/tinysurfx${{ matrix.ext }}" "dist/$NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          else
            (cd dist && shasum -a 256 "$NAME" > "$NAME.sha256")
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tinysurfx-${{ matrix.asset }}
          path: dist/*
          retention-days: 14

  publish:
    name: Publish release assets
    # Publish on tag pushes AND on every push to `rolling` (auto-tag-and-bump).
    # PRs to `rolling` go through release.yml's separate flow.
    if: |
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/rolling')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history for tag walk
          fetch-tags: true # actions/checkout@v6 doesn't fetch tags by default

      - name: Compute release tag
        id: compute
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag push: use the pushed tag verbatim.
            TAG="${{ github.ref_name }}"
          else
            # Push to rolling: reuse a tag already at HEAD if one exists
            # (e.g. release.yml just tagged this commit), otherwise bump the
            # patch version from the latest v*.*.* tag.
            EXISTING=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -n "$EXISTING" ]; then
              TAG="$EXISTING"
              echo "Reusing existing tag at HEAD: $TAG"
            else
              LAST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v1.29.0")
              IFS='.' read -r MAJ MIN PATCH <<< "${LAST#v}"
              TAG="v${MAJ}.${MIN}.$((PATCH+1))"
              echo "Bumping from $LAST to $TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.compute.outputs.tag }}
          name: ${{ steps.compute.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            tinysurfx-*/tinysurfx-*
